services:
  chia-analysis:
    image: python:3.12-slim
    restart: unless-stopped
    ports:
      - "9050:5000"
    command: >
      sh -c "apt-get update &&
             apt-get install -y --no-install-recommends git &&
             rm -rf /app &&
             git clone --depth 1 https://github.com/V01dK4p1Gl1tch/Chia_analysis.git /app &&
             cd /app &&
             pip install --no-cache-dir -r requirements.txt &&
             gunicorn -b 0.0.0.0:5000 -w 2 --threads 4 app:app"